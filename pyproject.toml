[project]
name = "windguru"
version = "0.3.12"
description = "Windguru CLI, MCP server, and Python library — kite spot + gear advice for riders and agents"
authors = [{ name = "Berend Gort", email = "berend.gort@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["windguru", "forecast", "wind", "kitesurf", "cli", "mcp", "weather"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "curl-cffi>=0.7.0",
    "pydantic>=2.10.0",
    "rich>=13.8.0",
    "tenacity>=9.0.0",
    "typer>=0.15.1",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.2",
    "mcp>=1.2.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "twine>=6.0.0",
]
all = [
    "windguru[mcp]",
]

[project.scripts]
guru = "guru.cli.main:cli"
guru-mcp = "guru.mcp._entry:run"
guru-mcp-http = "guru.mcp._entry:run_http"
guru-mcp-tunnel = "guru.mcp._entry:run_tunnel"

[project.urls]
Homepage = "https://github.com/berendgort/guru"
Repository = "https://github.com/berendgort/guru"
Issues = "https://github.com/berendgort/guru/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guru"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits live Windguru (opt-in)"]
